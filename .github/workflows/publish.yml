name: Publish package

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_sha:
        description: SHA completa de 40 hex de recuperación anclada a main (opcional)
        required: false

concurrency:
  group: publish-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      target_sha: ${{ steps.target.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
      - name: Resolve release target
        id: target
        shell: bash
        env:
          RELEASE_SHA: ${{ github.event.inputs.release_sha || '' }}
        run: |
          set -euo pipefail
          git fetch origin main --tags
          origin_main="$(git rev-parse origin/main)"
          target="$origin_main"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            if [ -n "$RELEASE_SHA" ]; then
              release_sha="${RELEASE_SHA,,}"
              if ! [[ "$release_sha" =~ ^[0-9a-f]{40}$ ]]; then
                echo "::error::release_sha debe ser una SHA completa de 40 hex."
                exit 1
              fi
              if ! git merge-base --is-ancestor "$release_sha" "$origin_main"; then
                echo "::error::$release_sha no pertenece a main."
                exit 1
              fi
              target="$release_sha"
            fi
          fi
          git checkout --detach "$target"
          echo "sha=$target" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 11.22.0
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
          cache: pnpm
      - name: Resolve pinned public Stack snapshot
        id: stack-source
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const parity = JSON.parse(readFileSync("contract/parity.v2.json", "utf8"));
            const repository = parity?.source?.repository;
            const commit = parity?.source?.commit;
            if (!/^https:\/\/github\.com\/[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+$/.test(repository ?? "")) throw new Error("parity.v2.source.repository must be a public GitHub repository");
            if (!/^[a-f0-9]{40}$/.test(commit ?? "")) throw new Error("parity.v2.source.commit must be a full lowercase SHA");
            console.log(`repository=${repository.slice("https://github.com/".length)}`);
            console.log(`commit=${commit}`);
          ' >> "$GITHUB_OUTPUT"
      - name: Check out pinned Stack snapshot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ steps.stack-source.outputs.repository }}
          ref: ${{ steps.stack-source.outputs.commit }}
          path: .jorgex-stack
          fetch-depth: 1
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - name: Verify cross-repo parity against the pinned Stack snapshot
        run: JORGEX_STACK_DIR="${{ github.workspace }}/.jorgex-stack" node --test tests/cross-repo/snapshot-parity.test.mjs
      - run: pnpm pack --pack-destination .validation-artifacts

  plan:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      publish: ${{ steps.release.outputs.publish }}
      version: ${{ steps.release.outputs.version }}
      publish_sha: ${{ steps.release.outputs.publish_sha }}
      tag_needed: ${{ steps.release.outputs.tag_needed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.validate.outputs.target_sha }}
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 11.22.0
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
      - name: Resolve release plan
        id: release
        env:
          RELEASE_SHA: ${{ github.event.inputs.release_sha || '' }}
          TARGET_SHA: ${{ needs.validate.outputs.target_sha }}
        run: node ./scripts/release-policy.mjs plan

  publish:
    needs: plan
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.plan.outputs.publish_sha }}
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 11.22.0
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - name: Verify trusted-publishing npm
        env:
          MINIMUM_NPM_VERSION: "11.5.1"
        run: |
          set -euo pipefail
          npm_version="$(npm --version)"
          node - "$npm_version" "$MINIMUM_NPM_VERSION" <<'NODE'
          const [current, minimum] = process.argv.slice(2);
          const parse = (value) => value.split(".").map((part) => Number.parseInt(part, 10));
          const [currentParts, minimumParts] = [parse(current), parse(minimum)];
          const compatible = minimumParts.every((part, index) => (currentParts[index] ?? 0) === part)
            || currentParts.some((part, index) => part > (minimumParts[index] ?? 0)
              && currentParts.slice(0, index).every((value, prefix) => value === minimumParts[prefix]));
          if (!compatible) throw new Error(`npm ${current} is older than required ${minimum}.`);
          NODE
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - name: Pack exact release
        run: |
          mkdir -p .release-artifacts
          pnpm pack --pack-destination .release-artifacts
      - name: Publish exact release
        run: npm publish .release-artifacts/jorgex-pi-${{ needs.plan.outputs.version }}.tgz --ignore-scripts --provenance

  tag-release:
    needs: [plan, publish]
    if: always() && !cancelled() && needs.publish.result != 'failure' && needs.publish.result != 'cancelled' && (needs.publish.result == 'success' || needs.plan.outputs.tag_needed == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.plan.outputs.publish_sha }}
          fetch-depth: 0
      - name: Create immutable release tag
        shell: bash
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          SHA: ${{ needs.plan.outputs.publish_sha }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          git fetch origin --tags
          if git rev-parse --verify --quiet "refs/tags/$tag" > /dev/null; then
            existing="$(git rev-list -n 1 "$tag")"
            if [ "$existing" != "$SHA" ]; then
              echo "::error::$tag apunta a $existing, no a $SHA."
              exit 1
            fi
            exit 0
          fi
          git tag "$tag" "$SHA"
          git push origin "$tag"
