name: Publish package

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_sha:
        description: SHA completa de main aceptada/publicada para recuperación
        required: true
        type: string

concurrency:
  group: publish-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      needed: ${{ steps.plan.outputs.needed }}
      publish: ${{ steps.plan.outputs.publish }}
      version: ${{ steps.plan.outputs.version }}
      sha: ${{ steps.plan.outputs.sha }}
      tag: ${{ steps.plan.outputs.tag }}
      integrity: ${{ steps.artifact.outputs.integrity }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.18.0"
      - name: Resolve immutable main candidate
        id: target
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: node scripts/release-policy.mjs target
      - name: Select candidate
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: git checkout --detach "$TARGET_SHA"
      - name: Resolve version prepared in PR
        id: plan
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: node scripts/release-policy.mjs plan
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        if: steps.plan.outputs.needed == 'true'
      - if: steps.plan.outputs.needed == 'true'
        run: pnpm install --frozen-lockfile --ignore-scripts
      - if: steps.plan.outputs.needed == 'true'
        run: pnpm --config.verify-deps-before-run=false test
      - name: Pack once and validate native integrity
        if: steps.plan.outputs.needed == 'true'
        id: artifact
        env:
          PUBLISH: ${{ steps.plan.outputs.publish }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release"
          pnpm --config.verify-deps-before-run=false pack --pack-destination "$RUNNER_TEMP/release"
          mv "$RUNNER_TEMP/release/"*.tgz "$RUNNER_TEMP/release/package.tgz"
          node scripts/release-policy.mjs artifact "$RUNNER_TEMP/release/package.tgz"
          cp scripts/release-policy.mjs "$RUNNER_TEMP/release/release-policy.mjs"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: steps.plan.outputs.needed == 'true'
        with:
          name: release
          path: ${{ runner.temp }}/release/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: validate
    if: needs.validate.outputs.needed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.validate.outputs.version }}
      INTEGRITY: ${{ needs.validate.outputs.integrity }}
      SHA: ${{ needs.validate.outputs.sha }}
      PUBLISH: ${{ needs.validate.outputs.publish }}
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: release
          path: ${{ runner.temp }}/release
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.18.0"
          registry-url: https://registry.npmjs.org
      - name: Check bytes and registry before publishing or rerunning
        id: ready
        run: node "$RUNNER_TEMP/release/release-policy.mjs" prepare "$RUNNER_TEMP/release/package.tgz"
      - name: Publish exact validated tarball by OIDC
        if: steps.ready.outputs.publish == 'true'
        run: npm publish "$RUNNER_TEMP/release/package.tgz" --ignore-scripts --provenance --access public
      - name: Confirm registry integrity before tagging
        run: node "$RUNNER_TEMP/release/release-policy.mjs" verify "$RUNNER_TEMP/release/package.tgz"

  tag-release:
    needs: [validate, publish]
    if: needs.publish.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      # No checkout, artifact execution or product code with a repository write token.
      - name: Create immutable tag after registry byte confirmation
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.validate.outputs.tag }}
          SHA: ${{ needs.validate.outputs.sha }}
        run: |
          set -euo pipefail
          trap 'echo "::error::npm bytes were verified, but tagging failed. Recover using workflow_dispatch with release_sha=$SHA; never republish or move a tag."' ERR
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$TAG" =~ ^compact-tools-v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if gh api "repos/$GH_REPO/git/ref/tags/$TAG" > "$RUNNER_TEMP/ref.json" 2> "$RUNNER_TEMP/ref-error"; then
            object="$(jq -c .object "$RUNNER_TEMP/ref.json")"
            while [ "$(jq -r .type <<< "$object")" = tag ]; do
              object="$(gh api "repos/$GH_REPO/git/tags/$(jq -r .sha <<< "$object")" --jq '.object')"
            done
            test "$(jq -r .type <<< "$object")" = commit
            test "$(jq -r .sha <<< "$object")" = "$SHA"
          elif grep -q 'HTTP 404' "$RUNNER_TEMP/ref-error"; then
            gh api --method POST "repos/$GH_REPO/git/refs" -f "ref=refs/tags/$TAG" -f "sha=$SHA"
          else
            cat "$RUNNER_TEMP/ref-error" >&2
            exit 1
          fi
