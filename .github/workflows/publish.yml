name: Publish package

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_sha:
        description: SHA completa de recuperación anclada a main (opcional)
        required: false

concurrency:
  group: publish-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      target_sha: ${{ steps.target.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
      - name: Resolve release target
        id: target
        env:
          RELEASE_SHA: ${{ github.event.inputs.release_sha || '' }}
        run: |
          set -euo pipefail
          git fetch origin main --tags
          target="$(git rev-parse origin/main)"
          if [ -n "$RELEASE_SHA" ]; then
            if ! [[ "$RELEASE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
              echo 'release_sha debe ser una SHA completa.' >&2
              exit 1
            fi
            git merge-base --is-ancestor "$RELEASE_SHA" "$target"
            target="${RELEASE_SHA,,}"
          fi
          git checkout --detach "$target"
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            if (JSON.parse(readFileSync("package.json", "utf8")).name !== "compact-tools") {
              throw new Error("No se publica el paquete legacy desde este workflow.");
            }
          '
          echo "sha=$target" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          run_install: false
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm test
      - run: pnpm pack --pack-destination "$RUNNER_TEMP"

  plan:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      publish: ${{ steps.release.outputs.publish }}
      version: ${{ steps.release.outputs.version }}
      publish_sha: ${{ steps.release.outputs.publish_sha }}
      tag_needed: ${{ steps.release.outputs.tag_needed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.validate.outputs.target_sha }}
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          run_install: false
      - name: Resolve release plan
        id: release
        env:
          RELEASE_SHA: ${{ github.event.inputs.release_sha || '' }}
          TARGET_SHA: ${{ needs.validate.outputs.target_sha }}
        run: node ./scripts/release-policy.mjs plan

  publish:
    needs: plan
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.plan.outputs.publish_sha }}
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          run_install: false
      - name: Verify trusted-publishing npm
        run: |
          npm_version="$(npm --version)"
          node - "$npm_version" <<'NODE'
          const [major, minor, patch] = process.argv[2].split('.').map(Number);
          if (!(major > 11 || (major === 11 && (minor > 5 || (minor === 5 && patch >= 1))))) {
            throw new Error('Trusted publishing requiere npm >=11.5.1.');
          }
          NODE
      - name: Pack exact release
        run: |
          mkdir -p .release-artifacts
          pnpm pack --pack-destination .release-artifacts
      - name: Publish exact release
        run: npm publish .release-artifacts/compact-tools-${{ needs.plan.outputs.version }}.tgz --ignore-scripts --provenance

  tag-release:
    needs: [plan, publish]
    if: always() && !cancelled() && needs.publish.result != 'failure' && needs.publish.result != 'cancelled' && (needs.publish.result == 'success' || needs.plan.outputs.tag_needed == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.plan.outputs.publish_sha }}
          fetch-depth: 0
      - name: Create immutable package tag
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          SHA: ${{ needs.plan.outputs.publish_sha }}
        run: |
          set -euo pipefail
          tag="compact-tools-v$VERSION"
          git fetch origin --tags
          if git rev-parse --verify --quiet "refs/tags/$tag" > /dev/null; then
            test "$(git rev-list -n 1 "$tag")" = "$SHA"
          else
            git tag "$tag" "$SHA"
            git push origin "$tag"
          fi
